app:
  description: 質問文に「コード」という単語が含まれるかどうかでプロンプトを出し分ける分岐サンプル。
  icon: 🔀
  icon_background: '#E0F2FE'
  mode: workflow
  name: サンプル分岐ワークフロー
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-ifelse
      source: start
      sourceHandle: source
      target: ifelse
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: if-else
        isInIteration: false
    - id: ifelse-llm_code
      source: ifelse
      sourceHandle: 'true'
      target: llm_code
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: llm
        isInIteration: false
    - id: ifelse-llm_normal
      source: ifelse
      sourceHandle: 'false'
      target: llm_normal
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: llm
        isInIteration: false
    - id: llm_code-end_code
      source: llm_code
      sourceHandle: source
      target: end_code
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: end
        isInIteration: false
    - id: llm_normal-end_normal
      source: llm_normal
      sourceHandle: source
      target: end_normal
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: end
        isInIteration: false
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 320
      width: 244
      height: 90
      data:
        type: start
        title: 開始
        desc: ''
        variables:
        - variable: query
          label: 質問
          type: text-input
          required: true
          max_length: 256
    - id: ifelse
      type: custom
      position:
        x: 400
        y: 320
      width: 244
      height: 120
      data:
        type: if-else
        title: 分岐（「コード」を含むか）
        desc: ''
        cases:
        - case_id: 'true'
          logical_operator: and
          conditions:
          - id: cond-contains-code
            variable_selector:
            - start
            - query
            comparison_operator: contains
            value: コード
    - id: llm_code
      type: custom
      position:
        x: 720
        y: 200
      width: 244
      height: 120
      data:
        type: llm
        title: LLM コード回答
        desc: ''
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - role: system
          text: あなたは優秀なソフトウェアエンジニアです。ユーザーの質問はプログラミングに関する内容です。日本語で、必要に応じてコード例を交えて具体的に回答してください。
        - role: user
          text: '{{#start.query#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: llm_normal
      type: custom
      position:
        x: 720
        y: 440
      width: 244
      height: 120
      data:
        type: llm
        title: LLM 通常回答
        desc: ''
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: あなたは親切な日本語アシスタントです。プログラミングに限らない一般的な質問に、日本語で分かりやすく回答してください。
        - role: user
          text: '{{#start.query#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: end_code
      type: custom
      position:
        x: 1040
        y: 200
      width: 244
      height: 90
      data:
        type: end
        title: 終了（コード回答）
        desc: ''
        outputs:
        - variable: answer
          value_selector:
          - llm_code
          - text
    - id: end_normal
      type: custom
      position:
        x: 1040
        y: 440
      width: 244
      height: 90
      data:
        type: end
        title: 終了（通常回答）
        desc: ''
        outputs:
        - variable: answer
          value_selector:
          - llm_normal
          - text

app:
  description: 質問を受け取り、LLMが日本語で回答するだけの最小構成サンプル。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: サンプルQAワークフロー
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
    - id: llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: end
        isInIteration: false
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 280
      width: 244
      height: 90
      data:
        type: start
        title: 開始
        desc: ''
        variables:
        - variable: query
          label: 質問
          type: text-input
          required: true
          max_length: 256
    - id: llm
      type: custom
      position:
        x: 400
        y: 280
      width: 244
      height: 120
      data:
        type: llm
        title: LLM 回答生成
        desc: ''
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: あなたは親切な日本語アシスタントです。ユーザーの質問に、常に日本語で簡潔かつ丁寧に回答してください。
        - role: user
          text: '{{#start.query#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: end
      type: custom
      position:
        x: 720
        y: 280
      width: 244
      height: 90
      data:
        type: end
        title: 終了
        desc: ''
        outputs:
        - variable: answer
          value_selector:
          - llm
          - text
